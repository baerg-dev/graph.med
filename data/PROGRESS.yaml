# Progress — the registry of work on the pool, and the handover between sessions.
# Maintained by the parse-next-chunk skill; hand-editing is just as valid.
#
# Work is organised in passes per source. A pass has a scope_policy and an
# ordered chunk list; one session does one chunk and ends with a handover (this
# file updated, a pull request opened). A chunk's `does` is its instruction;
# its `kind` says what it touches: extraction (source → claims and edges),
# linking (the semantic layer), schema (schema/ and tools/validate.py, which
# always lands before the data that uses it), or build (tools/build.py and
# tools/site/). A chunk that reads the source names its pages.
#
# Terminal state: when the last chunk of a pass is done, the session sets the
# source's `next` to null and its `status` to `done`. The skill checks this
# before anything else and reports "done" instead of working. A later pass is a
# human decision: register it by bumping `pass`, redefining `scope_policy`,
# writing the chunk list and setting `status: in_progress` again.

sources:
  pomgat-lv-1.0:
    entity: sources/pomgat-lv-1.0
    status: in_progress      # in_progress | done
    pass: 2
    chunking: pass 1 filed claims and edges by chapter (below); pass 2 is organised by task
    scope_policy: >
      Pass 2 implements the physician's feedback on the first live view as
      decided on 2026-09-10 (spec §3.2, §4, §5, §6.7; publication.md §3; the
      whys in .claude/memory/design/document-structure-is-provenance.md and
      relations-are-edges-not-fields.md). In scope: schema 0.4.0; the source's
      outline, structure and every claim's section; short labels; facets;
      broader edges with the family concepts they need; and the site features
      that read these — chapter tree and search, short labels in boxes, the
      four-word direction legend, the section order, grouping by family. Out
      of scope: codes_as (needs a terminology import; see deferred), body-text
      enrichment, evidence profiles, quality indicators, pathways. Review of
      short labels and broader edges is the pull request; attestations are
      not required for them until the attestation machinery exists.
    claim_files:             # pass 1 layout — where a chapter's claims and edges are filed
      - {id: ch04,  chapters: "4.1–4.5",   pages: 26-39}
      - {id: ch05,  chapters: "5.1–5.7",   pages: 40-57}
      - {id: ch06,  chapters: "6.1–6.2",   pages: 58-74}
      - {id: ch07a, chapters: "7.1–7.3",   pages: 75-90}
      - {id: ch07b, chapters: "7.4.1",     pages: 91-102}
      - {id: ch07c, chapters: "7.4.2–7.7", pages: 103-111}
      - {id: ch08,  chapters: "8.1–8.2",   pages: 112-121}
      - {id: ch09,  chapters: "9",         pages: 122-124}
    chunks:
      - id: schema-0.4
        kind: schema
        status: done
        note: >
          Schema 0.4.0 as specified; the validator checks section against the
          outline and rejects broader cycles. The section filter form is an
          example in x-view-filters only — the build does not evaluate it yet
          (site-chapters-search).
        does: >
          Bump schema/schema.yaml to 0.4.0 and teach tools/validate.py the new
          checks. claim.section (string, x-provenance required like
          recommendation_no; the validator checks it names a section of the
          claim's source outline). source.outline (list of {section, title,
          page}; page physical) and source.structure (list of enum:
          chronologisch_perioperativ, versorgungspfad, anatomisch,
          entitaetsbezogen, modalitaetsbezogen, stadien_schweregrad,
          populationsbezogen, settingbezogen, leitsymptombezogen,
          berufsgruppen_prozessbezogen, querschnittskapitel). short_label
          (optional text) on statement, concept and the structural nodes; no
          maxLength yet (open-questions → short-label-limit). concept.facet
          (enum: procedure, patient_state, medication, intervention, outcome,
          finding). Edge kind broader: concept → concept with
          modelling_edge_props; the validator rejects cycles. Selection filter
          form section: {source, under} in x-view-filters. Data stays as it is
          (all new properties optional); the build needs no change yet.
      - id: outline
        kind: extraction
        pages: 1-130
        status: done
        note: >
          Outline of 100 sections from pp. 2–5, every heading verified on its
          physical page. Sections assigned by the quote's position relative to
          the headings on its page; box headers ("7.1 Konsensbasierte
          Empfehlung") and running page headers look like headings, so a
          heading counts only when its title follows the number. 4.1 and
          7.3.2 hold boxes directly, above their first subsection. In chapters
          4–9 only 5.7 (no box) has no claim; chapters 1–3 and 10–12 are front
          and back matter.
        depends: [schema-0.4]
        does: >
          Write the complete outline of POMGAT onto sources/pomgat-lv-1.0 from
          the table of contents — every numbered section of chapters 1–12,
          including those without a recommendation, with title and physical
          page — and structure [chronologisch_perioperativ, anatomisch,
          modalitaetsbezogen]. Then write section onto every claim in
          data/claims/pomgat-lv-1.0/ (the heading under which the claim's page
          lies; claim_files bounds each file's chapters). Validate; report the
          coverage (sections without a claim) in the PR.
      - id: site-chapters-search
        kind: build
        status: done
        note: >
          Chapter tree as an overlay panel (§ button), search box top left;
          both client-side on the view JSON, which now carries the outline
          and each statement's sections and search text. Facet filters wait
          for facets. Checked headless (Cytoscape in Node with a stubbed DOM),
          not in a browser — no browser is installable in the sandbox.
        depends: [outline]
        does: >
          publication.md §3 "Chapters and search": a chapter tree beside the
          graph from outline and section, hard filter including subsections,
          uncovered sections greyed; a search box that fades non-matches and
          counts "n matches in m sections". No data change.
      - id: short-labels-a
        kind: linking
        status: done
        note: >
          Limit settled at 60 (schema), target 55. Concepts got a short label
          above ~45 characters. Direction words kept ("Keine …", "… erwägbar"
          for kann); the organ or procedure in parentheses where siblings
          share a question. Two ICG statements in different groups were still
          told apart (Anastomose / Magenschlauch).
        depends: [schema-0.4]
        does: >
          short_label for every statement of ch04, ch05 and ch06 and for the
          concepts they use whose label is too long for a box. Siblings under
          one question must stay distinguishable by the short label alone
          (the nasogastric-tube statements are the test). Calibrate the limit
          on the longest statements, set maxLength in the schema (its own
          commit, first), and settle open-questions → short-label-limit.
      - id: short-labels-b
        kind: linking
        status: done
        note: >
          Same rules as short-labels-a. The six nasogastric-tube statements
          read "Magensonde … (kolorektal | Leber | Magen | Whipple |
          Ösophagektomie)". Every statement now has a short label; 62
          concepts do.
        depends: [short-labels-a]
        does: >
          The same for ch07a, ch07b, ch07c, ch08 and ch09 and their concepts.
      - id: facets
        kind: linking
        status: done
        note: >
          Rule applied: medication when the concept names a substance, a
          substance class or an ongoing drug therapy; intervention when it is
          a measure even if drugs are involved (Antibiotikaprophylaxe,
          Darmvorbereitung, PONV-Prophylaxe, anaesthesia techniques);
          procedure for resections and operative situations including
          anastomoses; finding for a circumstance that triggers a decision.
        depends: [schema-0.4]
        does: >
          facet on every concept, exactly one; no concept left unclassified.
          Name the borderline cases (procedure versus intervention) in the PR.
      - id: site-labels-panel
        kind: build
        status: pending
        depends: [short-labels-b, facets]
        does: >
          Boxes and edge answers show short_label with fallback to label; the
          direction legend in four words (settle open-questions →
          direction-legend against the statements); the detail section in the
          order of publication.md §3 "What the section shows", with section
          next to page and body-text claims grouped by refines, supplements,
          limits; facet filters next to the search.
      - id: broader-edges
        kind: linking
        status: pending
        depends: [facets]
        does: >
          Mint the family concepts (candidates: Ösophagus, Magen, Pankreas,
          Leber, Kolorektum, kardiale Dauermedikation, Risikoprofil,
          eingriffsübergreifend), each with facet and label; a broader edge
          with rationale for every concept with a recognisable parent, several
          where the source's boundaries warrant it. No statement moves. Settle
          open-questions → concept-hierarchy-depth.
      - id: site-hierarchy
        kind: build
        status: pending
        depends: [broader-edges]
        does: >
          Patient groups fold by family: an answer is a root concept, unfolding
          into its members; recommendations stay on the member they were made
          for. publication.md §3 "Answers in order of weight".
    next: site-labels-panel
    deferred:
      - >
        codes_as: no terminology namespace is imported yet. Rule once one is,
        by facet — procedure → OPS, patient_state → ICD-10-GM, outcome and
        finding → SNOMED CT where available; first candidates
        concepts/pankreasresektion → ops-2026/5-52 and the codes C18/C20 in
        QI 1's denominator (p. 122). A concept without a code must be shown as
        uncoded, not as unchecked.
      - >
        evidence profiles (the per-outcome GRADE tables in evidence-based
        boxes) — no shape in the schema; open-questions → evidence-profiles
      - >
        gap_notice claims (boxes 4.3, 4.6, 5.10, 5.13, 7.8) are extracted and
