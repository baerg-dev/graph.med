# Progress — the registry of work on the pool, and the handover between sessions.
# Maintained by the parse-next-chunk skill; hand-editing is just as valid.
#
# Work is organised in passes per source. A pass has a scope_policy and an
# ordered chunk list; one session does one chunk and ends with a handover (this
# file updated, a pull request opened). A chunk's `does` is its instruction;
# its `kind` says what it touches: extraction (source → claims and edges),
# linking (the semantic layer), schema (schema/ and tools/validate.py, which
# always lands before the data that uses it), or build (tools/build.py and
# tools/site/). A chunk that reads the source names its pages.
#
# Terminal state: when the last chunk of a pass is done, the session sets the
# source's `next` to null and its `status` to `done`. The skill checks this
# before anything else and reports "done" instead of working. A later pass is a
# human decision: register it by bumping `pass`, redefining `scope_policy`,
# writing the chunk list and setting `status: in_progress` again.

sources:
  pomgat-lv-1.0:
    entity: sources/pomgat-lv-1.0
    status: in_progress      # in_progress | done — pass 3 registered from the physician's review of the live site
    pass: 3
    chunking: pass 1 filed claims and edges by chapter (below); passes 2 and 3 are organised by task
    scope_policy: >
      Pass 3 is the UI initiative: the site changes the physician asked for
      after reading the live view (publication.md §3, its "Navigation",
      "Chapters and search", "What the section shows"). In scope: folding at
      every question, a reset to the opening state, a layout in which every
      node and every answer is fully visible, the search finding everything
      it should, the detail section organised by the reader's six questions,
      and — once open-questions → box-colour is settled — boxes coloured by
      direction with the grade written in and EK shown like any other
      recommendation. Every chunk is a build chunk: tools/build.py and
      tools/site/ only; no data change, no schema change. Each is checked in
      a browser on desktop and phone (the screenshot skill) and the PR links
      its preview at graph.med/preview/pr<N>/. Out of scope, registered
      below as deferred: how structural and organisational recommendations
      are told apart (needs data), grouping axes and specialised views, the
      extraction-quality pass, and the review and feedback mechanisms.
    claim_files:             # pass 1 layout — where a chapter's claims and edges are filed
      - {id: ch04,  chapters: "4.1–4.5",   pages: 26-39}
      - {id: ch05,  chapters: "5.1–5.7",   pages: 40-57}
      - {id: ch06,  chapters: "6.1–6.2",   pages: 58-74}
      - {id: ch07a, chapters: "7.1–7.3",   pages: 75-90}
      - {id: ch07b, chapters: "7.4.1",     pages: 91-102}
      - {id: ch07c, chapters: "7.4.2–7.7", pages: 103-111}
      - {id: ch08,  chapters: "8.1–8.2",   pages: 112-121}
      - {id: ch09,  chapters: "9",         pages: 122-124}
    chunks:
      - id: site-search-recall
        kind: build
        status: pending
        does: >
          The search does not find every node it should (the chapter tree
          finds them). Reproduce: for each statement, search its short label,
          each slot concept's label and a word from its quote, and list what
          the search misses and why. Then make the search match what
          publication.md §3 says it matches — label, short label, slot
          concepts and the claims' text — for statements, groups and the
          answers on the edges (a condition is an edge, not a node), and match
          without regard to case or diacritics (Ösophagus finds osophagus).
          The counter and the fading stay as they are. Say in the PR which
          misses each change fixed.
      - id: site-layout-visibility
        kind: build
        status: pending
        does: >
          Nothing may overlap and every node and every answer must be fully
          readable — currently, with a large family open (Kolorektale
          Chirurgie, Operation eines gastrointestinalen Tumors), answers
          written at the end of their edges run into each other and into the
          boxes beside them. Reproduce it in the browser, then fix the
          placement: the label's own size in the layout, more separation
          where answers converge, or answers drawn as nodes of their own if
          nothing else holds. Screenshots before and after, desktop and
          phone, in the PR; the tree stays one tree, left to right, folded.
      - id: site-fold-and-reset
        kind: build
        status: pending
        depends: [site-layout-visibility]
        does: >
          publication.md §3 "Folded by default" and "Reset": tapping a
          question folds everything below it and tapping it again restores
          what was open there (Welche Population? folds the whole tree to the
          root and the question; Welche Bedingung? folds its group's
          conditions and recommendations); a reset button beside the fit
          button returns the page to its opening state — folded, no search,
          no facet, no chapter, nothing selected; and the chapter tree's
          "all" row stays fixed at the top of the panel while the list
          scrolls, so the way back is always one tap.
      - id: site-panel-six-questions
        kind: build
        status: pending
        does: >
          publication.md §3 "What the section shows": the statement's detail
          section organised by the six questions a reader brings, each a
          heading in the chrome language, in this order — what should I do
          (direction banner, full label); does this apply to my patient
          (population with its family, condition); how binding and how well
          supported (each supporting claim's grade, verb and consensus, EK
          marked; an evidence level only once open-questions →
          evidence-profiles gives claims one); what could
          change the answer (the body text: refines, supplements, limits,
          each with page and section); where exactly is it written (source,
          recommendation number, page, section, the quote with its copy
          button and the link into the document); would the answer differ in
          a neighbouring situation (the statements under the same group and
          condition, the same action in other groups, and the specializes,
          complements and conflicts edges). The same template renders the
          entity page. Concepts and claims keep their sections.
      - id: site-colour-by-direction
        kind: build
        status: pending
        depends: [site-panel-six-questions]
        does: >
          Only once open-questions → box-colour is settled, and as settled
          there. If the decision is colour by direction: boxes take the four
          direction colours (the banner's), the grade is written in the box
          after the glyph (A · B · 0 · EK), EK boxes are coloured by their
          direction like every other recommendation and carry "EK" as their
          grade text, the legend explains colours as directions and letters
          as grades, and the memory view-page-is-a-decision-tree and
          publication.md §3 are amended in the same PR. If the decision goes
          the other way, do what it says instead.
    next: site-search-recall
    deferred:
      - >
        structural and organisational recommendations (the specialised nurse
        in mPOM, box 8.7, is the example given): the physician's point is that a recommendation a physician on the ward cannot act on
        should be told apart — in the tree with a marker, or outside it. Needs
        a marker in the data (a facet value on the action concept, or a
        statement property) before the site can show it; open-questions →
        structural-recommendations. Initiative: extraction quality.
      - >
        grouping axes and specialised views: the physician asks for the
        broader hierarchy to be defined rather than emerge, for groupings to
        choose families by — the outline, the anatomical region, the
        operative phase — and for views that hide aspects ("show me every
        node that …"), which is the query-language question again;
        open-questions → grouping-axes and view-filter-language. Initiative:
        views and groupings; a schema-and-linking pass, then a build pass.
      - >
        extraction quality: the body-text relations (refines, supplements,
        limits) are read heterogeneously across chapters, and contextual
        criteria are sometimes incomplete — the amylase criterion refining
        6.7 (p. 64) lacks the alternatives the text gives beside it (day 1
        and 3 with the drain volume, or three times the serum concentration
        on day 3). A linking pass with a written rule per relation,
        chapter by chapter, checked against the quotes. Initiative:
        extraction quality.
      - >
        review and feedback: a way for an expert reading the site to say
        "this box should be one recommendation, not three" (the granularity
        is settled per sentence — memory box-granularity-per-sentence — but
        an expert may want a different split for a given box) and for that to
        reach the pool as a reviewable proposal — an affordance in the
        detail section that opens a prefilled issue is the smallest form;
        and "LLM as a judge", an automated review of extractions against the
        source, so far only a heading. Initiative: review and feedback.
      - >
        codes_as: no terminology namespace is imported yet. Rule once one is,
        by facet — procedure → OPS, patient_state → ICD-10-GM, outcome and
        finding → SNOMED CT where available; first candidates
        concepts/pankreasresektion → ops-2026/5-52 and the codes C18/C20 in
        QI 1's denominator (p. 122). A concept without a code must be shown as
        uncoded, not as unchecked.
      - >
        evidence profiles (the per-outcome GRADE tables in evidence-based
        boxes) — no shape in the schema; open-questions → evidence-profiles
      - >
        gap_notice claims (boxes 4.3, 4.6, 5.10, 5.13, 7.8) are extracted and
        unlinked — no edge kind fits; open-questions → gap-notices
      - >
        quality indicators (chapter 9, Tabelle 7, pp. 122–124): QI 1 →
        statements/keine-drainage-kolorektale-resektion (box 6.9), QI 2 →
        keine-drainage-unkomplizierte-leberresektion (6.8), QI 3 →
        magensonde-entfernung-vor-narkoseausleitung-kolorektal (7.1) with a
        denominator also covering the -magenresektion and -leberresektion
        statements, QI 4 → dauerkatheter-entfernung-24h-kolorektal and
        dauerkatheter-verlaengert-bei-harnverhaltrisiko (7.5/7.6) narrowed to
        onkologische Kolonresektion; also the chapter's definition of
        Qualitätsindikatoren (p. 122) and the note that none is in the
        onkologischer Basisdatensatz; open-questions → quality-indicators
      - >
        body-text enrichment (refines/supplements/limits beyond the criterion
        claims), page-anchored candidates: p. 27 continue calcium antagonists
        for angina, pause for hypertension on the day of surgery (a
        recommendation outside any box); §5.7 sedierende Prämedikation has no
        box, its text weighs benzodiazepines case by case and names melatonin;
