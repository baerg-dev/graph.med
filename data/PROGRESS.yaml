# Parsing progress — the handover between parsing sessions.
# Maintained by the parse-next-chunk skill; hand-editing is just as valid.
# One chunk is processed per session; a chunk is done when its claims are
# extracted (phase one) AND linked into the semantic layer (phase two), and
# the PROGRESS entry records what was deferred.
#
# Terminal state: when the last chunk of a pass is done, the session sets the
# source's `next` to null and its `status` to `done`. The skill checks this
# before anything else and reports "done" instead of parsing. A later pass
# (body-text enrichment, evidence profiles, codes_as) is a human decision:
# register it by bumping `pass`, redefining `scope_policy`, resetting the
# chunk list and setting `status: in_progress` again.

sources:
  pomgat-lv-1.0:
    entity: sources/pomgat-lv-1.0
    status: in_progress      # in_progress | done
    pass: 1                  # which pass the chunk list below belongs to
    chunking: by chapter; printed page = physical page (verified, offset 0)
    scope_policy: >
      Pass 1 extracts the recommendation boxes (plus criteria the box text
      directly depends on). Body-text fragments (refines/supplements/limits),
      the evidence profiles (GRADE outcome tables), and codes_as links await
      later enrichment passes — see deferred.
    chunks:
      - {id: ch06, chapters: "6.1–6.2", pages: 58-74,  status: done,
         note: "15 boxes (6.1–6.15) + 1 criterion claim; 15 statements, 23 concepts; done 2026-09-05"}
      - {id: ch04, chapters: "4.1–4.5", pages: 26-39,  status: done,
         note: "10 boxes (4.1–4.10) → 16 recommendation claims (multi-sentence boxes split per sentence) + 2 gap_notice claims (4.3, 4.6) + 2 criterion claims (p. 27); 16 statements, 24 concepts, 20 edges; done 2026-09-05"}
      - {id: ch05, chapters: "5.1–5.7", pages: 40-57,  status: done,
         note: "13 boxes (5.1–5.13; 5.7 has none) → 18 recommendation + 1 fact + 2 gap_notice + 1 criterion claims; compound grades A/B, B/0 split per sentence by verb; 19 statements, 25 concepts (+3 reused), 23 edges; done 2026-09-05"}
      - {id: ch07a, chapters: "7.1–7.3", pages: 75-90, status: done,
         note: "13 boxes (7.1–7.13) → 12 recommendation (7.7 split per sentence) + 1 fact (7.11, evidence-based statement) + 1 gap_notice (7.8) + 1 criterion (p. 88) claims; 13 statements, 16 concepts (+3 reused), 16 edges; done 2026-09-05"}
      - {id: ch07b, chapters: "7.4.1",   pages: 91-102, status: done,
