# Parsing progress — the handover between parsing sessions.
# Maintained by the parse-next-chunk skill; hand-editing is just as valid.
# One chunk is processed per session; a chunk is done when its claims are
# extracted (phase one) AND linked into the semantic layer (phase two), and
# the PROGRESS entry records what was deferred.

sources:
  pomgat-lv-1.0:
    entity: sources/pomgat-lv-1.0
    status: in_progress
    chunking: by chapter; printed page = physical page (verified, offset 0)
    scope_policy: >
      Pass 1 extracts the recommendation boxes (plus criteria the box text
      directly depends on). Body-text fragments (refines/supplements/limits),
      the evidence profiles (GRADE outcome tables), and codes_as links await
      later enrichment passes — see deferred.
    chunks:
