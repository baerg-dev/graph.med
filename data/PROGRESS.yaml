      - >
        cross-statement edges (specializes/complements) not yet asserted;
        first candidates 7.12 (TAP block, minimally invasive colorectal) and
        7.13 (peripheral regional analgesia) against 7.9/7.10 (epidural)
      - >
        no pathway authored; chapter 6 is a recommendation list, not a
        decision algorithm; open-questions → decision-graph-derivation
