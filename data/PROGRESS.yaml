      - {id: ch08, chapters: "8.1–8.2", pages: 112-121, status: done,
         note: "7 boxes (8.1–8.7: mPOM per organ, specialised perioperative nurse) → 7 recommendation claims; 7 statements, 4 concepts (+4 reused), 7 edges; done 2026-09-05"}
      - {id: ch09, chapters: "9",       pages: 122-124, status: pending}
    next: ch09
    deferred:
      - evidence profiles (the per-outcome GRADE symbol tables in evidence-based
        boxes) are not yet modelled; the schema has no shape for them — raise as
        an open question when a consumer needs them
      - codes_as links (e.g. concepts/pankreasresektion → ops-2026/5-52) await
        a terminology import; none exists in the pool yet
      - no pathway/view authored yet; chapter 6 is recommendations, not a
        decision pathway — a views/ cut becomes worthwhile once a chapter's
        statements form one
      - gap_notice claims (ch04 boxes 4.3, 4.6; ch05 boxes 5.10, 5.13; ch07a box 7.8) are extracted but have no
