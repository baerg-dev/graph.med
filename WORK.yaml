# WORK.yaml — the registry of work packages: what is registered to be done, in
# order. This is the handover between sessions: a session takes the first
# package, does it, removes it here, and opens a pull request
# (.claude/skills/next-work-package/SKILL.md runs that loop).
#
# A package is one session's work: an extraction (pages of a source → claims and
# edges), a linking pass (the semantic layer), a schema change (schema/ and the
# validator, always landing before the data that uses it), a build feature
# (tools/build.py and tools/site/), a docs change, or tooling. Its `does` is the
# instruction; `kind` says which rules of the skill apply; `depends` names
# packages above it that must land first; `initiative` names the scope it
# belongs to. An extraction package names its `source` and `pages`.
#
# Done packages are removed, not marked: git holds what was done and the pull
# request holds what was learned. When `packages` is empty, nothing is
# registered, and the skill says so instead of working. Registering a package is
# a human decision — a session may add to `later`, never to `packages` on its
# own. An initiative whose last package is removed is removed with it. The
# validator checks this file (ids unique, depends point upward, initiatives and
# sources resolve).

initiatives:
  ui:
    title: The site as the physician reads it
    scope: >
      The site changes the physician asked for after reading the live view
      (publication.md §3, its "Folded by default", "Everything readable",
      "The interaction", "Chapters and search", "What the section shows").
      Build packages only: tools/build.py and tools/site/; no data change, no
      schema change. Each is checked in a browser on desktop and phone (the
      screenshot skill) and its PR links the preview at
      graph.med/preview/pr<N>/. Out of scope, under `later`: how structural
      and organisational recommendations are told apart (needs data),
      grouping axes and specialised views, extraction quality, review and
      feedback.

packages:
  - id: site-search-recall
    initiative: ui
    kind: build
    does: >
      The search does not find every node it should (the chapter tree finds
      them). Reproduce: for each statement, search its short label, each slot
      concept's label and a word from its quote, and list what the search
      misses and why. Then make the search match what publication.md §3 says
      it matches — label, short label, slot concepts and the claims' text —
      for statements, groups and the answers on the edges (a condition is an
      edge, not a node), and match without regard to case or diacritics
      (Ösophagus finds osophagus). The counter and the fading stay as they
      are. Say in the PR which misses each change fixed.
  - id: site-layout-visibility
    initiative: ui
    kind: build
    does: >
      Nothing may overlap and every node and every answer must be fully
      readable — currently, with a large family open (Kolorektale Chirurgie,
      Operation eines gastrointestinalen Tumors), answers written at the end
      of their edges run into each other and into the boxes beside them.
      Reproduce it in the browser, then fix the placement: the label's own
      size in the layout, more separation where answers converge, or answers
      drawn as nodes of their own if nothing else holds. Screenshots before
      and after, desktop and phone, in the PR; the tree stays one tree, left
      to right, folded.
  - id: site-question-at-every-branch
    initiative: ui
    kind: build
    depends: [site-layout-visibility]
    does: >
      publication.md §3 "Every branching is a question": an opened family
      today forks straight into its member groups — answers on the edges, no
      diamond — and the physician read that as a branch without a decision.
      Put "Welche Population?" between a family's junction and its members,
      so the reader always passes a question to reach an answer; the
      family's own recommendations keep hanging from its junction (through
      "Welche Bedingung?" where they have a condition). Folding, counts and
      deep links behave as before; the question node folds with the family.
  - id: site-fold-and-reset
    initiative: ui
    kind: build
    depends: [site-question-at-every-branch]
    does: >
      publication.md §3 "Folded by default" and "The interaction": tapping a
      question folds everything below it and tapping it again restores what
      was open there (the first "Welche Population?" folds the whole tree to
      the root and itself; a family's "Welche Population?" folds its members;
      "Welche Bedingung?" folds its group's conditions and recommendations);
      a reset button beside the fit button returns the page to its opening
      state — folded, no search, no facet, no chapter, nothing selected; and
      the chapter tree's "all" row stays fixed at the top of the panel while
      the list scrolls, so the way back is always one tap.
  - id: site-panel-six-questions
    initiative: ui
    kind: build
    does: >
      publication.md §3 "What the section shows": the statement's detail
      section organised by the six questions a reader brings, each a heading
      in the chrome language, in this order — what should I do (direction
      banner, full label); does this apply to my patient (population with its
      family, condition); how binding and how well supported (each supporting
      claim's grade, verb and consensus, EK marked; an evidence level only
      once open-questions → evidence-profiles gives claims one); what could
      change the answer (the body text: refines, supplements, limits, each
      with page and section); where exactly is it written (source,
      recommendation number, page, section, the quote with its copy button
      and the link into the document); would the answer differ in a
      neighbouring situation (the statements under the same group and
      condition, the same action in other groups, and the specializes,
      complements and conflicts edges). The same template renders the entity
      page. Concepts and claims keep their sections.
  - id: site-colour-by-direction
    initiative: ui
    kind: build
    depends: [site-panel-six-questions]
    does: >
      Only once open-questions → box-colour is settled, and as settled there.
      If the decision is colour by direction: boxes take the four direction
      colours (the banner's), the grade is written in the box after the glyph
      (A · B · 0 · EK), EK boxes are coloured by their direction like every
      other recommendation and carry "EK" as their grade text, the legend
      explains colours as directions and letters as grades, and the memory
      view-page-is-a-decision-tree and publication.md §3 are amended in the
      same PR. If the decision goes the other way, do what it says instead.

later:   # named, not registered; a package is made of one when a human decides
  - >
    structural and organisational recommendations (the specialised nurse in
    mPOM, box 8.7, is the example given): the physician's point is that a
    recommendation a physician on the ward cannot act on should be told
    apart — in the tree with a marker, or outside it. Needs a marker in the
    data (a facet value on the action concept, or a statement property)
    before the site can show it; open-questions → structural-recommendations.
    Initiative: extraction quality.
  - >
    grouping axes and specialised views: the physician asks for the broader
    hierarchy to be defined rather than emerge, for groupings to choose
    families by — the outline, the anatomical region, the operative phase —
    and for views that hide aspects ("show me every node that …"), which is
    the query-language question again; open-questions → grouping-axes and
    view-filter-language. Initiative: views and groupings; schema and linking
    packages, then build packages.
  - >
    extraction quality: the body-text relations (refines, supplements,
    limits) are read heterogeneously across chapters, and contextual criteria
    are sometimes incomplete — the amylase criterion refining 6.7 (p. 64)
    lacks the alternatives the text gives beside it (day 1 and 3 with the
    drain volume, or three times the serum concentration on day 3). Linking
    packages with a written rule per relation, chapter by chapter, checked
    against the quotes. Initiative: extraction quality.
  - >
    review and feedback: a way for an expert reading the site to say "this
    box should be one recommendation, not three" (the granularity is settled
    per sentence — memory box-granularity-per-sentence — but an expert may
    want a different split for a given box) and for that to reach the pool as
    a reviewable proposal — an affordance in the detail section that opens a
    prefilled issue is the smallest form; and "LLM as a judge", an automated
    review of extractions against the source, so far only a heading.
    Initiative: review and feedback.
  - >
    codes_as: no terminology namespace is imported yet. Rule once one is, by
    facet — procedure → OPS, patient_state → ICD-10-GM, outcome and finding →
    SNOMED CT where available; first candidates concepts/pankreasresektion →
    ops-2026/5-52 and the codes C18/C20 in QI 1's denominator (p. 122). A
    concept without a code must be shown as uncoded, not as unchecked.
  - >
    evidence profiles (the per-outcome GRADE tables in evidence-based boxes)
    — no shape in the schema; open-questions → evidence-profiles
  - >
    gap_notice claims (boxes 4.3, 4.6, 5.10, 5.13, 7.8) are extracted and
    unlinked — no edge kind fits; open-questions → gap-notices
  - >
    quality indicators (chapter 9, Tabelle 7, pp. 122–124): QI 1 →
    statements/keine-drainage-kolorektale-resektion (box 6.9), QI 2 →
    keine-drainage-unkomplizierte-leberresektion (6.8), QI 3 →
    magensonde-entfernung-vor-narkoseausleitung-kolorektal (7.1) with a
    denominator also covering the -magenresektion and -leberresektion
    statements, QI 4 → dauerkatheter-entfernung-24h-kolorektal and
    dauerkatheter-verlaengert-bei-harnverhaltrisiko (7.5/7.6) narrowed to
    onkologische Kolonresektion; also the chapter's definition of
    Qualitätsindikatoren (p. 122) and the note that none is in the
    onkologischer Basisdatensatz; open-questions → quality-indicators
  - >
    body-text enrichment (refines/supplements/limits beyond the criterion
    claims), page-anchored candidates: p. 27 continue calcium antagonists for
    angina, pause for hypertension on the day of surgery (a recommendation
    outside any box); §5.7 sedierende Prämedikation has no box, its text
    weighs benzodiazepines case by case and names melatonin; p. 78 no
    recommendation on nasogastric tubes after pylorus-preserving pancreatic
    head resection, pancreato-gastrostomy and distal pancreatectomy; p. 79 a
    secondary nasogastric tube on delayed gastric emptying after liver
    resection; p. 84 defers balanced analgesia to the S3 guideline on acute
    perioperative pain; pp. 92–100 five gap notices outside boxes
    (methylnaltrexone p. 92, local anaesthetics p. 93, propranolol p. 94,
    dexmedetomidine p. 95 withheld after the 2022 Rote-Hand-Brief, laxatives
    p. 100, each "für andere viszeralonkologische Operationen … keine
    Empfehlung") and the note that alvimopan is effective but unlicensed in
    Germany (p. 92); p. 105 no RCT data on chewing gum after minimally
    invasive liver or pancreatic resection; pp. 108–109 the rationale for
    7.29's EK; p. 121 "zu anderen Organ-Entitäten … keine Empfehlung" for the
    specialised nurse, in tension with box 8.7 and to be read with it
  - >
    cross-statement edges (specializes/complements) not yet asserted; first
    candidates 7.12 (TAP block, minimally invasive colorectal) and 7.13
    (peripheral regional analgesia) against 7.9/7.10 (epidural)
  - >
    no pathway authored; chapter 6 is a recommendation list, not a decision
    algorithm; open-questions → decision-graph-derivation
