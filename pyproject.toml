# Python tooling for graph.med. Managed with uv: `uv sync` installs, `uv run
# tools/validate.py` and `uv run tools/build.py` run. There is no package to build;
# this only pins the two scripts' dependencies and the interpreter they are tested
# against.
[project]
name = "graph-med-tools"
version = "0.1.0"
description = "Validator and site build for the graph.med pool (data/ against schema/schema.yaml; site/ from data/)"
requires-python = ">=3.12"
dependencies = [
    "jinja2>=3.1,<4",
    "jsonschema>=4.26.0",
    "pyyaml>=6,<7",
]

[tool.uv]
package = false
