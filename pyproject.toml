# Python tooling for graph.med. Managed with uv: `uv sync` installs, `uv run
# tools/validate.py` runs. There is no package to build; this only pins the
# validator's dependencies and the interpreter it is tested against.
[project]
name = "graph-med-tools"
version = "0.1.0"
description = "Validator for the graph.med pool (data/ against schema/schema.yaml)"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6,<7",
]

[tool.uv]
package = false
